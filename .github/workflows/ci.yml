name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # A push whose author GitHub declines to run Actions for lands on `main` with
  # no `validate` check, which then blocks `release.yml`'s CI gate on a commit
  # that is otherwise fine. Manual dispatch is the recovery lever for that: it
  # produces the missing check without rewriting history or retagging.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Bootstrap CI runtime
        run: bash scripts/ci/ci-bootstrap.sh --context ci --install-codex-cli

      - name: Clippy unwrap/expect surface (warn-only — visibility for unwrap-cleanup wave)
        continue-on-error: true
        run: |
          set -uo pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          # Capture clippy output unconditionally; warn-level workspace
          # lints should never error, but if they do we still want the
          # surface count published rather than failing CI.
          cargo clippy --workspace --tests --no-deps >"$log" 2>&1 || true
          total=$(grep -E '^warning: `nils-' "$log" | awk -F'generated ' '{print $2}' | awk '{s+=$1} END {print s+0}')
          {
            echo "## Clippy unwrap/expect surface"
            echo ""
            echo "Total clippy warnings (workspace, tests included): **${total:-0}**"
            echo ""
            echo '<details><summary>Per-target breakdown</summary>'
            echo ''
            echo '```'
            grep -E '^warning: `nils-' "$log" | sed 's/^warning: //' | sort || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate project
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/local-pre-commit.sh --mode ci

      - name: Package smoke
        run: bash scripts/ci/ci-run-gates.sh package-smoke --skip-arch-check
