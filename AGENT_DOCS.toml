[[document]]
context = "project-dev"
scope = "project"
path = "BINARY_DEPENDENCIES.md"
required = false
when = "always"
notes = "On-demand local toolchain and dependency reference; read for setup, dependency, or degradation changes."

[[document]]
context = "project-dev"
scope = "project"
path = "ALFRED_WORKFLOW_DEVELOPMENT.md"
required = false
when = "always"
notes = "On-demand workflow runtime, Script Filter, and troubleshooting standard; read for applicable workflow changes."

[[document]]
context = "project-dev"
scope = "project"
path = "docs/PACKAGING.md"
required = false
when = "always"
notes = "On-demand packaging, install, and macOS acceptance guide; read only for packaging or release surfaces."

# Finish-line validation contract: code edits in this repo must run the local
# pre-commit gate before a project-dev task is declared done (agent-docs v0.30+).
[[validation]]
context = "project-dev"
commands = ["bash scripts/local-pre-commit.sh"]
marker = ".cache/agent-validation/project-dev.ok"
description = "Run the local pre-commit gate (lint, script-filter policy, scraper tests, workflow tests) before declaring a project-dev task done."

# Opt in to the project-local skill-name prefix lint (agent-docs v1.0+):
# `agent-docs audit` flags any `.agents/skills/<name>` directory whose name is
# not lowercase kebab-case starting with `project-` or `private-`.
[skills]
enforce_name_prefix = true
