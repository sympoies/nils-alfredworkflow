[package]
name = "nils-workflow-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "workflow_common"
path = "src/lib.rs"

[dependencies]
alfred-core = { package = "nils-alfred-core", path = "../alfred-core", version = "1.0.3" }
chrono.workspace = true
clap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
thiserror.workspace = true
walkdir.workspace = true

[features]
default = []
# Opt-in clap value-enum mirror of the Script Filter `--output` flag.
# Consumers that build a clap CLI enable this to reuse
# `ScriptFilterOutputModeArg` instead of redefining it per crate.
clap = ["dep:clap"]
# Opt-in blocking HTTP client builder primitive for workflow CLIs that already
# construct reqwest clients locally.
http = ["dep:reqwest"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
