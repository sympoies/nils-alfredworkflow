[package]
name = "nils-google-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Rust Google CLI for auth, Gmail, and Drive."

[lib]
name = "google_cli"
path = "src/lib.rs"

[[bin]]
name = "google-cli"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
directories = "=6.0.0"
google-apis-common = "=8.0.0"
google-drive3 = "=7.0.0"
google-gmail1 = "=7.0.0"
keyring = "=4.1.6"
mail-builder = "=0.4.4"
mime_guess = "=2.0.5"
workflow-common = { package = "nils-workflow-common", path = "../workflow-common", version = "1.0.3", features = ["http"] }
open = "=5.4.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
yup-oauth2 = "=12.1.2"

[dev-dependencies]
tempfile.workspace = true
wiremock = "=0.6.5"

[lints]
workspace = true
